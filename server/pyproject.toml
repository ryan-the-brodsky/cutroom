[project]
name = "cutroom"
version = "0.1.0"
description = "Cutroom — hosted studio for directing AI-generated limited-animation film"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pillow>=10.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]
postgres = ["psycopg2-binary>=2.9"]

[project.scripts]
cutroom = "cutroom.main:cli"
cutroom-worker = "cutroom.worker.__main__:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cutroom*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
